name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build-and-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build and start
        run: docker compose up -d --build

      - name: Check health
        run: |
          sleep 5
          curl -f http://localhost:8080/nope

      - name: Show logs on failure
        if: failure()
        run: docker compose logs

      - name: Stop
        if: always()
        run: docker compose down
